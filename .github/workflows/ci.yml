name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]
        # Playwright browser binaries must be installed for Playwright to execute if tests run full integration tests.
        # But we mock it in unit tests so we don't necessarily need to install browsers in CI to save time.

    - name: Run Ruff Linter
      run: |
        ruff check .

    - name: Check Formatting with Ruff
      run: |
        ruff format --check .

    - name: Run Unit Tests with Coverage
      run: |
        pytest --cov=src tests/ --cov-report=xml

    # Upload test results coverage to Codecov or keep artifacts if needed
